<!doctype html><meta charset="utf-8"><body><pre id="o"></pre><script>
const out=[];const log=s=>{console.log(s);out.push(s);document.getElementById("o").textContent=out.join("\n")};
const iso=t=>new Date(t*1000).toISOString().slice(0,16),B="https://dataset.api.hub.geosphere.at/v1/grid/forecast/nwp-v2-1h-1km?output_format=netcdf&bbox=45.50,8.10,49.48,17.74";
async function f(lbl,url){const c=new AbortController(),tm=setTimeout(()=>c.abort(),75000),t0=performance.now();
 try{const r=await fetch(url,{signal:c.signal});const b=await r.arrayBuffer();log(lbl+" status="+r.status+" bytes="+b.byteLength+" "+Math.round(performance.now()-t0)+"ms")}
 catch(e){log(lbl+" FEHLER "+e.name+" "+Math.round(performance.now()-t0)+"ms")}clearTimeout(tm)}
(async()=>{try{
 const mm=await (await fetch("https://dataset.api.hub.geosphere.at/v1/grid/forecast/nwp-v2-1h-1km/metadata")).json(),ref=Date.parse(mm.last_forecast_reftime)/1000;log("model ref "+iso(ref));
 const h1=Math.ceil(Date.now()/3600000+1)*3600,P="&parameters=tp,sf";
 await f("A single +3h",B+P+"&start="+iso(h1+3*3600)+"&end="+iso(h1+3*3600));
 await f("B 2fr +24h",B+P+"&start="+iso(h1+24*3600)+"&end="+iso(h1+25*3600));
 await f("C 6fr +24h",B+P+"&start="+iso(h1+24*3600)+"&end="+iso(h1+29*3600));
 await f("D tp single +24h",B+"&parameters=tp&start="+iso(h1+24*3600)+"&end="+iso(h1+24*3600));
 await f("E single +36h",B+P+"&start="+iso(h1+36*3600)+"&end="+iso(h1+36*3600));
 await f("F 3fr +0h",B+P+"&start="+iso(h1)+"&end="+iso(h1+2*3600));
 await Promise.all([f("G par1 +12..14",B+P+"&start="+iso(h1+12*3600)+"&end="+iso(h1+14*3600)),f("G par2 +15..17",B+P+"&start="+iso(h1+15*3600)+"&end="+iso(h1+17*3600))]);
 await f("H whole run ref..+60h tp only",B+"&parameters=tp&start="+iso(ref)+"&end="+iso(ref+60*3600));
}catch(e){log("FEHLER "+e)}log("FERTIG")})();
</script>
