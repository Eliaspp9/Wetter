name: Testdaten Radar
on:
  push:
    branches: [testdaten-nc]
permissions:
  contents: write
jobs:
  holen:
    if: "!contains(github.event.head_commit.message, 'Daten: Radar NetCDF')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GeoSphere pruefen
        run: |
          mkdir -p gs
          B=https://dataset.api.hub.geosphere.at/v1
          curl -sS --retry 3 "$B/datasets?type=grid&mode=forecast" -o gs/datasets.json
          python3 -c "import json;d=json.load(open('gs/datasets.json'));print('\n'.join(sorted(d.keys())))" > gs/datasets.txt || true
          for ds in nwp-v1-1h-2500m ensemble-v1-1h-2500m nowcast-v1-15min-1km; do curl -sS --retry 3 "$B/grid/forecast/$ds/metadata" -o gs/meta-$ds.json; sleep 1; done
          BB=45.50,8.10,49.48,17.74
          ST=$(date -u -d "@$(( ($(date +%s)/900)*900 - 2700 ))" +%Y-%m-%dT%H:%M)
          curl -sS -D gs/rr.hdr --retry 3 "$B/grid/forecast/nowcast-v1-15min-1km?parameters=rr&output_format=netcdf&bbox=$BB&start=$ST" -o gs/rr.nc; sleep 1
          curl -sS -D gs/rrt.hdr --retry 3 "$B/grid/forecast/nowcast-v1-15min-1km?parameters=rr,t2m&output_format=netcdf&bbox=$BB&start=$ST" -o gs/rrt.nc; sleep 1
          for o in 1 3 5 6; do curl -sS -D gs/off$o.hdr --retry 3 "$B/grid/forecast/nowcast-v1-15min-1km?parameters=rr&output_format=netcdf&bbox=$BB&forecast_offset=$o" -o gs/off$o.nc; sleep 1; done
          ls -la gs
      - name: Ablegen
        run: |
          git config user.name "testdaten"; git config user.email "testdaten@users.noreply.github.com"
          git add om gs && git commit -qm "Daten: Radar NetCDF (gs)" && git push -q
