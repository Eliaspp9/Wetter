name: Worker veröffentlichen
# Veröffentlicht worker/kachelmann-proxy.js bei Cloudflare, wenn er sich ändert (oder von Hand gestartet).
# Braucht das Repository-Secret CLOUDFLARE_API_TOKEN (Cloudflare-Vorlage „Edit Cloudflare Workers“). Ohne Secret passiert nichts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/kachelmann-proxy.js", "worker/deploy_config.py", ".github/workflows/worker.yml"]
concurrency: worker-deploy
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Token vorhanden?
        id: chk
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then echo "Kein CLOUDFLARE_API_TOKEN hinterlegt, der Worker wird nicht veröffentlicht."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Einstellungen des Workers lesen
        if: steps.chk.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER: wetter-proxy
        run: python3 worker/deploy_config.py
      - name: Code prüfen
        if: steps.chk.outputs.ok == '1'
        run: cp worker/kachelmann-proxy.js /tmp/w.mjs && node --check /tmp/w.mjs
      - name: Veröffentlichen
        if: steps.chk.outputs.ok == '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
      - name: Läuft er?
        if: steps.chk.outputs.ok == '1'
        run: |
          sleep 5
          curl -s https://wetter-proxy.elias-ziegler.workers.dev/ | head -c 400; echo
