name: Testdaten Radar
on:
  push:
    branches: [testdaten-nc]
permissions:
  contents: write
jobs:
  holen:
    if: "!contains(github.event.head_commit.message, 'Daten: Radar NetCDF')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echte Antwort holen
        run: |
          mkdir -p om
          B="https://api.open-meteo.com/v1/forecast?latitude=48.17&longitude=14.24&timezone=auto&forecast_days=7"
          F="&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,is_day,cloud_cover,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,weather_code,precipitation,wind_speed_10m,wind_gusts_10m,snowfall,cloud_cover,cloud_cover_low,relative_humidity_2m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max"
          curl -sS "$B$F&models=geosphere_claef_austria,dwd_icon_d2_native,ecmwf_ifs,best_match" -o om/real.json
          curl -sS "https://api.open-meteo.com/v1/forecast?latitude=48.17&longitude=14.24&hourly=temperature_2m&models=icon_seamless,ecmwf_ifs,gfs_seamless,ecmwf_aifs025_single,dwd_aicon_global_native,ncep_aigfs025,geosphere_claef_austria,dwd_icon_d2_native&forecast_days=7&timezone=auto" -o om/mx.json
          head -c 300 om/real.json
      - name: Ablegen
        run: |
          git config user.name "testdaten"; git config user.email "testdaten@users.noreply.github.com"
          git add om && git commit -qm "Daten: Radar NetCDF (echt)" && git push -q
