name: Testdaten Radar
on:
  push:
    branches: [testdaten-nc]
permissions:
  contents: write
jobs:
  holen:
    if: "!contains(github.event.head_commit.message, 'Daten: Radar NetCDF')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echte Antworten holen
        run: |
          mkdir -p om
          F="&timezone=auto&forecast_days=7&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,is_day,cloud_cover,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,weather_code,precipitation,wind_speed_10m,wind_gusts_10m,snowfall,cloud_cover,cloud_cover_low,relative_humidity_2m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max"
          for i in 1 2 3; do curl -sS --retry 3 "https://api.open-meteo.com/v1/forecast?latitude=48.17&longitude=14.24$F&models=dwd_icon_d2_ruc_native,geosphere_claef_austria,dwd_icon_d2_native,ecmwf_ifs,best_match" -o om/at.json && break; sleep 3; done
          curl -sS --retry 3 "https://api.open-meteo.com/v1/forecast?latitude=39.1&longitude=-94.58$F&models=ncep_rrfs_conus,ncep_rrfs_north_america,ncep_nbm_conus,ecmwf_ifs,best_match" -o om/us.json
          curl -sS --retry 3 "https://api.open-meteo.com/v1/forecast?latitude=35.68&longitude=139.76$F&models=jma_msm,ecmwf_ifs,best_match" -o om/jp.json
          curl -sS --retry 3 "https://api.open-meteo.com/v1/forecast?latitude=49.28&longitude=-123.12$F&models=cmc_gem_hrdps_west,cmc_gem_hrdps,ncep_rrfs_north_america,ecmwf_ifs,best_match" -o om/ca.json
          ls -la om
      - name: Ablegen
        run: |
          git config user.name "testdaten"; git config user.email "testdaten@users.noreply.github.com"
          git add om && git commit -qm "Daten: Radar NetCDF (echt2)" && git push -q
